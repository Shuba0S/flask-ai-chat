{% extends 'base.html' %}
{% block content %}
<h2>Login</h2>
<form method="post">
    {{ form.hidden_tag() }}
    <p>{{ form.email.label }}<br>{{ form.email(size=40) }}</p>
    <p>{{ form.password.label }}<br>{{ form.password() }}</p>
    <p>{{ form.submit(class="btn") }}</p>
</form>
<p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a>.</p>
{% endblock %}
